<style>
  * { box-sizing: border-box; }
  html { background-color: #d3edfb; scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", sans-serif;
    color: #333;
    background-color: #d3edfb;
    background-image:
      linear-gradient(45deg, #d3edfb 25%, transparent 25%, transparent 75%, #d3edfb 75%),
      linear-gradient(45deg, #d3edfb 25%, transparent 25%, transparent 75%, #d3edfb 75%),
      url("bg-tile.jpg");
    background-size: 240px 240px, 240px 240px, 120px 120px;
    background-position: 0 0, 120px 120px, 0 0;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; text-align: center; }
  .logo { width: min(100%, 460px); height: auto; display: block; margin: 0 auto; }
  .top-logo { display: block; width: 100%; height: auto; border-radius: 16px; margin: 0 0 14px; }
  .site-title { margin: 18px 0 0; text-align: center; font-size: 1.7em; color: #2f6d96; background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); }
  .photo { position: relative; margin: 18px 0 0; }
  .photo img { display: block; width: 100%; height: auto; border-radius: 20px; box-shadow: 0 6px 18px rgba(70, 130, 180, 0.3); }
  .photo-text { position: absolute; left: 0; right: 0; bottom: 16px; margin: 0; text-align: center; font-size: 1.7em; font-weight: 900; letter-spacing: 0.06em; color: #fff; text-shadow: 2px 0 0 #ff5e8a, -2px 0 0 #ff5e8a, 0 2px 0 #ff5e8a, 0 -2px 0 #ff5e8a, 2px 2px 0 #ff5e8a, -2px -2px 0 #ff5e8a, 2px -2px 0 #ff5e8a, -2px 2px 0 #ff5e8a, 0 4px 12px rgba(0, 0, 0, 0.4); }
  .subtitle { margin: 10px 0 2px; font-size: 1.05em; font-weight: 700; color: #2f6d96; }
  .menu { display: flex; flex-direction: column; gap: 40px; margin-top: 64px; text-align: left; }
  .card { position: relative; display: block; text-decoration: none; color: #333; background: #fff; border-radius: 20px; padding: 20px 22px; box-shadow: inset 0 0 0 6px #fff, 0 4px 14px rgba(70, 130, 180, 0.3); border: 3px solid #1a1a1a; }
  .card::before { content: ""; position: absolute; top: 6px; bottom: 6px; left: 6px; width: 10px; background: var(--accent, #ff8fab); border-radius: 11px 0 0 11px; pointer-events: none; }
  .penguin-peek { position: absolute; right: 14px; bottom: calc(100% - 2px); width: 54px; image-rendering: pixelated; pointer-events: none; }
  .card h2 { margin: 0 0 6px; font-size: 1.5em; line-height: 1.3; }
  .card p { margin: 0; font-size: 1em; color: #666; line-height: 1.5; }
  .card:active { transform: scale(0.98); }
  .card-1 { --accent: #ff8fab; background: #ffe0eb; }
  .card-1 h2 { color: #e75480; }
  .card-2 { --accent: #ffb703; }
  .card-2 h2 { color: #dd9a00; }
  .card-3 { --accent: #7bc96f; background: #e2f5dc; }
  .card-3 h2 { color: #4c9a3f; }
  .card-4 { --accent: #5ec8e5; }
  .card-4 h2 { color: #1d8fb5; }
  .card-5 { --accent: #b388ff; background: #eee7ff; }
  .card-5 h2 { color: #7e57c2; }
  .card-6 { --accent: #ff8c42; background: #ffe9d6; }
  .card-6 h2 { color: #e8590c; }
  .card-7 { --accent: #38bdf8; background: #dcf2fe; }
  .card-7 h2 { color: #0284c7; }
  .card-8 { --accent: #ef4444; background: #ffe1e1; }
  .card-8 h2 { color: #dc2626; }
  .card-9 { --accent: #a855f7; }
  .card-9 h2 { color: #9333ea; }
  .card-10 { --accent: #22c55e; }
  .card-10 h2 { color: #16a34a; }
  .yt-photo { display: block; margin-top: 28px; }
  .yt-photo img { display: block; width: 100%; height: auto; border-radius: 20px; box-shadow: 0 6px 18px rgba(70, 130, 180, 0.3); }
  .yt { display: block; margin-top: 28px; background: #ff0000; color: #fff; text-decoration: none; font-weight: 800; font-size: 1.05em; line-height: 1.5; padding: 16px 18px; border-radius: 16px; box-shadow: 0 4px 14px rgba(255, 0, 0, 0.3); }
  .sns-block { margin-top: 28px; background: #fff; border-radius: 20px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); }

  .sns-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .sns-links a { display: inline-block; background: #eef7fd; color: #2f6d96; text-decoration: none; font-weight: 700; font-size: 0.95em; padding: 10px 18px; border-radius: 999px; box-shadow: 0 2px 8px rgba(70, 130, 180, 0.25); }
  .sns-links a:active { transform: scale(0.97); }
  footer { margin-top: 28px; }

  .section-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
  .section-nav a { display: inline-block; background: #fff; color: #2f6d96; text-decoration: none; font-weight: 700; font-size: 0.9em; padding: 8px 14px; border-radius: 999px; box-shadow: 0 2px 8px rgba(70, 130, 180, 0.25); }
  .section-nav a:active { transform: scale(0.97); }
  .section { margin-top: 32px; text-align: left; }
  .section > h2 { margin: 0 0 14px; text-align: center; font-size: 1.45em; color: #2f6d96; background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); }
  .section p { line-height: 1.7; }
  .section .menu { margin-top: 0; }
  .intro-text { background: #fff; border-radius: 20px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); margin: 0 0 16px; }
  .members { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .member { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); text-align: center; }
  .member .band { height: 10px; }
  .member h3 { margin: 10px 8px 4px; font-size: 1.05em; }
  .member p { margin: 0 8px 12px; font-size: 0.9em; color: #666; line-height: 1.5; }
  .news-list { list-style: none; margin: 0; padding: 0; background: #fff; border-radius: 20px; padding: 16px 20px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); }
  .news-list li { padding: 8px 0; border-bottom: 1px dashed #cfe6f5; line-height: 1.6; }
  .news-list li:last-child { border-bottom: none; }
  .news-list time { font-weight: 800; color: #2f6d96; margin-right: 8px; white-space: nowrap; }
  .schedule-text { background: #fff; border-radius: 20px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); margin: 0; text-align: center; }
  .album { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .album figure { margin: 0; background: #fff; border-radius: 20px; padding: 10px 10px 14px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); }
  .album img { display: block; width: 100%; height: auto; border-radius: 14px; }
  .album figcaption { margin-top: 10px; text-align: center; font-weight: 700; color: #2f6d96; }
  .contact-text { background: #fff; border-radius: 20px; padding: 18px 20px; box-shadow: 0 4px 14px rgba(70, 130, 180, 0.25); margin: 0; text-align: center; }
  .line-btn { display: block; margin-top: 16px; background: #06c755; color: #fff; text-decoration: none; font-weight: 800; font-size: 1.05em; text-align: center; line-height: 1.5; padding: 16px 18px; border-radius: 16px; box-shadow: 0 4px 14px rgba(6, 199, 85, 0.35); }
  .line-btn:active { transform: scale(0.98); }
  .section .yt-photo { margin-top: 0; }
  .section .yt { margin-top: 16px; }
  .yt-link { display: block; margin-top: 16px; text-align: center; font-weight: 700; color: #2f6d96; }
  .back-link { display: inline-block; margin-top: 28px; font-weight: 700; color: #2f6d96; text-decoration: none; background: #fff; border-radius: 999px; padding: 10px 18px; box-shadow: 0 2px 8px rgba(70, 130, 180, 0.25); }
</style>
