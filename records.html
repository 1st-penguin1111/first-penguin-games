<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あなたの記録 | ファーストペンギン ゲーム集</title>
<link rel="apple-touch-icon" href="bg-tile.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ファスペンゲーム集">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4aa8e0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background-color:#d3edfb}
body{margin:0;min-height:100vh;font-family:"M PLUS Rounded 1c","Zen Maru Gothic",sans-serif;color:#333;background-color:#d3edfb;background-image:linear-gradient(45deg,#d3edfb 25%,transparent 25%,transparent 75%,#d3edfb 75%),linear-gradient(45deg,#d3edfb 25%,transparent 25%,transparent 75%,#d3edfb 75%),url("bg-tile.jpg");background-size:240px 240px,240px 240px,120px 120px;background-position:0 0,120px 120px,0 0}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 40px;text-align:center}
.logo{width:min(100%,460px);height:auto;display:block;margin:0 auto}
h1{margin:18px 0 6px;font-size:1.5em;color:#2f6d96;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 4px 14px rgba(70,130,180,.25)}
.note{font-size:.85em;color:#2f6d96;font-weight:700;margin:8px 0 0}
.summary{margin:14px 0 0;font-weight:700;color:#2f6d96;background:#fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 8px rgba(70,130,180,.25)}
.list{margin-top:18px;text-align:left;display:flex;flex-direction:column;gap:10px}
.row{background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 3px 10px rgba(70,130,180,.25);padding:12px 14px;border-left:10px solid var(--accent,#bfe3f5)}
.row .name{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:1.02em}
.row .rec{margin-top:3px;font-weight:700;color:#2f6d96}
.row .rec .cleared{color:#16a34a}
.row .rec .none{color:#9db8c6}
.row[data-cat="taiketsu"]{--accent:#ef4444}
.row[data-cat="score"]{--accent:#0284c7}
.row[data-cat="puzzle"]{--accent:#8b5cf6}
.row[data-cat="nonbiri"]{--accent:#22c55e}
.section-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.section-nav a{display:inline-block;background:#fff;color:#2f6d96;text-decoration:none;font-weight:700;font-size:.9em;padding:8px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(70,130,180,.25)}
footer{margin-top:28px}
footer span{display:inline-block;background:rgba(255,255,255,.92);border-radius:999px;padding:6px 16px;font-size:.85em;color:#6b8ca3;box-shadow:0 2px 8px rgba(70,130,180,.25)}
.back-link{display:inline-block;margin-top:20px;font-weight:700;color:#2f6d96;text-decoration:none;background:#fff;border-radius:999px;padding:10px 18px;box-shadow:0 2px 8px rgba(70,130,180,.25)}
</style>
</head>
<body>
<div class="wrap">
<a href="index.html"><img class="logo" src="logo.png" alt="ファーストペンギン ゲーム集"></a>
<h1>🏆 あなたの記録</h1>
<p class="note">記録はこの端末・ブラウザに保存されます。遊ぶたびに自動で更新されます。</p>
<p class="summary" id="summary" hidden></p>
<div class="list" id="list"><p class="note">読み込み中…</p></div>
<a class="back-link" href="games.html">← ゲーム集へもどる</a>
<nav class="section-nav">
<a href="index.html">トップ</a>
<a href="intro.html">紹介</a>
<a href="news.html">ニュース</a>
<a href="album.html">アルバム</a>
<a href="games.html">ゲーム集</a>
<a href="contact.html">お問い合わせ</a>
<a href="youtube.html">YouTube</a>
</nav>
<footer><span>ファーストペンギン</span></footer>
</div>
<script>
(function(){
var records={};
try{records=JSON.parse(localStorage.getItem('fpg_records_v1')||'{}')||{};}catch(e){records={};}
var list=document.getElementById('list');
function render(cards){
list.innerHTML='';
var cleared=0,totalPlays=0;
cards.forEach(function(c){
var rec=records[c.id];
var row=document.createElement('div');
row.className='row';
row.setAttribute('data-cat',c.cat);
var name=document.createElement('div');
name.className='name';
name.textContent=(c.emoji?c.emoji+' ':'')+c.name;
var recLine=document.createElement('div');
recLine.className='rec';
if(rec){
var plays=Number(rec.plays)||0;
totalPlays+=plays;
if(rec.cleared)cleared++;
var parts=[];
if(rec.cleared)parts.push('<span class="cleared">✓ クリア済み</span>');
if(rec.best!==undefined&&rec.best!==null&&String(rec.best).trim()!=='')parts.push('記録：'+String(rec.best).replace(/&/g,'&amp;').replace(/</g,'&lt;'));
if(!parts.length)parts.push('記録：―');
parts.push(plays+'回プレイ');
recLine.innerHTML=parts.join(' ・ ');
}else{
recLine.innerHTML='<span class="none">記録：記録なし</span>';
}
row.appendChild(name);
row.appendChild(recLine);
list.appendChild(row);
});
var summary=document.getElementById('summary');
if(cards.length){
summary.textContent='クリア済み '+cleared+'/'+cards.length+'本 ・ 合計 '+totalPlays+'回プレイ';
summary.hidden=false;
}
}
fetch('games.html').then(function(r){return r.text();}).then(function(t){
var doc=new DOMParser().parseFromString(t,'text/html');
var cards=Array.prototype.slice.call(doc.querySelectorAll('.card[data-game]')).map(function(a){
var h=a.querySelector('h2');
var th=a.querySelector('.thumb');
return {id:a.getAttribute('data-game'),cat:a.getAttribute('data-cat')||'',name:h?h.textContent:'',emoji:th?th.textContent:''};
});
render(cards);
}).catch(function(){
list.innerHTML='<p class="note">ゲーム一覧を読み込めませんでした。ゲーム集から開き直してみてね。</p>';
});
})();
</script>
</body>
</html>
