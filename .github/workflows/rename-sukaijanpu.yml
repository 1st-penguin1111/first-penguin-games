name: Rename uploaded file

on:
  push:
    paths:
      - .github/workflows/rename-sukaijanpu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file with git mv -f
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f sukaijanpu-friction-upload.html sukaijanpu.html
          git commit -m "Replace sukaijanpu.html with friction version (ice friction up + airplane launch ending)"
          git push
