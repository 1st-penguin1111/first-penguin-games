name: Rename sukaijanpu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sukaijanpu.html with balloon version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f sukaijanpu-balloon-upload.html sukaijanpu.html
          git commit -m "Replace sukaijanpu.html with balloon version"
          git push
