name: Rename sukaijanpu file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename sukaijanpu-upload.html to sukaijanpu.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv sukaijanpu-upload.html sukaijanpu.html
          git commit -m "Rename sukaijanpu-upload.html to sukaijanpu.html"
          git push
