name: Rename koronda file

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename koronda-noearly-upload.html to koronda.html
        run: |
          git mv -f koronda-noearly-upload.html koronda.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace koronda.html with no-early-turn version"
          git push
