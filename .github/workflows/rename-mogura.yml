name: Rename moguratataki file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename moguratataki file
        run: |
          mv -f moguratataki-upload.html moguratataki.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename moguratataki-upload.html to moguratataki.html"
          git push
