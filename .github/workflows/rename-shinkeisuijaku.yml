name: rename-shinkeisuijaku
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace shinkeisuijaku.html with special version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f shinkeisuijaku-special-upload.html shinkeisuijaku.html
          git commit -m "Replace shinkeisuijaku.html with special version (special cards x3 + star 3pt)"
          git push
