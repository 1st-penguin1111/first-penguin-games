name: Rename ziyankenrpg file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename ziyankenrpg-upload.html to ziyankenrpg.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv ziyankenrpg-upload.html ziyankenrpg.html
          git commit -m "Rename ziyankenrpg-upload.html to ziyankenrpg.html"
          git push
