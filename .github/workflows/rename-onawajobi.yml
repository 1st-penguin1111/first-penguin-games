name: Rename onawajobi file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv huasupenda-nawa-tiao-bi.html onawajobi.html
          git commit -m "Rename huasupenda-nawa-tiao-bi.html to onawajobi.html"
          git push
