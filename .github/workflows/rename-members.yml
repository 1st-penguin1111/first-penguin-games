name: Rename members-new to members

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename members-new.jpg to members.jpg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f members-new.jpg members.jpg
          git commit -m "Replace members.jpg with new illustration"
          git push
