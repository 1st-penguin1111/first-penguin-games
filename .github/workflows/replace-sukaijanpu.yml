name: Replace sukaijanpu.html

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-sukaijanpu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sukaijanpu.html with uploaded version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f sukaijanpu-upload.html sukaijanpu.html
          git commit -m "Replace sukaijanpu.html with fixed stock version"
          git push
