name: Replace sukaijanpu.html

on:
  push:
    paths:
      - .github/workflows/replace-sukaijanpu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sukaijanpu.html with uploaded version
        run: mv sukaijanpu-upload.html sukaijanpu.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace sukaijanpu.html with latest version"
            git push
          fi
