name: Replace sanpo.html

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-sanpo.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace sanpo.html with fixed version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f sanpo-upload.html sanpo.html
          git commit -m "Replace sanpo.html with fixed version"
          git push
