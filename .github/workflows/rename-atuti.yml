name: Rename atuti file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename atuti-bigbtn-upload.html to atutixiang-itehoi.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f atuti-bigbtn-upload.html atutixiang-itehoi.html
          git commit -m "Replace atutixiang-itehoi.html with big-button version"
          git push
