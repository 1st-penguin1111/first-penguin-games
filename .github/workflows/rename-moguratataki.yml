name: Rename moguratataki (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace moguratataki.html with no-bonus version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f moguratataki-nobonus-upload.html moguratataki.html
          git commit -m "Replace moguratataki.html with no-bonus version"
          git push
