name: Rename uploaded game files
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename game files with git mv -f
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv -f ziyankenrpg-menu-upload.html ziyankenrpg.html
          git mv -f onawajobi-menu-upload.html onawajobi.html
          git mv -f moguratataki-menu-upload.html moguratataki.html
          git mv -f sukaijanpu-menu-upload.html sukaijanpu.html
          git status --short
          git commit -m "Replace 4 game files with latest versions (menu button on result screen)"
          git push
