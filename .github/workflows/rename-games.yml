name: Rename game files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace atutixiang-itehoi.html and 8ren-sheng-tiba-kikadogemu.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q atutixiang-itehoi.html 8ren-sheng-tiba-kikadogemu.html
          git mv atutixiang-itehoi-upload.html atutixiang-itehoi.html
          git mv fasupen-upload.html 8ren-sheng-tiba-kikadogemu.html
          git commit -m "Replace atutixiang-itehoi.html and 8ren-sheng-tiba-kikadogemu.html with latest versions"
          git push
