name: Rename uploaded game files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename game files
        run: |
          git config user.name "1st-penguin1111"
          git config user.email "1st-penguin1111@users.noreply.github.com"
          git mv atutixiang-itehoi-upload.html atutixiang-itehoi.html
          git mv taiketsu-upload.html 8ren-sheng-tiba-kikadogemu.html
          git mv shinkeisuijaku-upload.html shinkeisuijaku.html
          git mv koronda-upload.html koronda.html
          git commit -m "Replace 4 game files with latest versions (menu button on result screen)"
          git push
