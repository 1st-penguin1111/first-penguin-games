name: Replace moguratataki

on:
  workflow_dispatch:

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace moguratataki.html with new version
        run: |
          git config user.name "1st-penguin1111"
          git config user.email "1st-penguin1111@users.noreply.github.com"
          git rm moguratataki.html
          git mv huasupenmoguratataki.html moguratataki.html
          git commit -m "Replace moguratataki.html with new version"
          git push
